[project]
name = "llm-dataset-service"
version = "0.1.0"
description = "Merged FastAPI service for sample building and LLM-based feature extraction"
readme = "README.md"
requires-python = "==3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pydantic-settings>=2.4.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.3.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
